org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
# KEEP both flags above set to false for now: this is Flutter's own,
# officially-documented temporary fix for the "your app uses plugins that
# apply Kotlin Gradle Plugin (KGP)" warning seen from mobile_scanner and
# share_plus during `flutter build apk` / `flutter run` (neither plugin has
# shipped the "Built-in Kotlin" migration yet as of mid-2026 — see their
# open GitHub issues: mobile_scanner #1705/#1708, share_plus #3831/#3745).
# Per https://docs.flutter.dev/release/breaking-changes/migrate-to-built-in-kotlin/for-app-developers :
# "Flutter has temporarily added support to allow KGP while apps and plugins
# migrate to AGP 9.0 or later, but this support will be removed in a future
# version of Flutter." So: the warning is expected, the build is NOT broken,
# and no other Gradle/AGP version change is needed right now. Once both
# plugins release a built-in-Kotlin-compatible version, upgrade them and
# remove these two flags (and the matching kotlinOptions/plugin changes the
# migration guide describes, if app/build.gradle.kts still needs them then).

# Overrides the Flutter Gradle plugin's default compileSdk/targetSdk, which
# on this Flutter SDK version defaults to 34 — too old for plugins like
# file_picker's flutter_plugin_android_lifecycle dependency, which need 36+.
# This property is read by the Flutter Gradle plugin's `flutter` extension
# and applied to every subproject (the app module AND every plugin module),
# unlike a plain `compileSdk = 36` in app/build.gradle.kts, which only
# affects the app module.
flutter.compileSdkVersion=36
flutter.targetSdkVersion=36
